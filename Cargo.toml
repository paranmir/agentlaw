[workspace]
resolver = "2"
members = [
  "crates/agentlaw-contracts",
  "crates/agentlaw-storage",
  "crates/agentlaw-search",
  "crates/agentlaw-worker",
  "crates/agentlaw-flows",
  "crates/agentlaw-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
