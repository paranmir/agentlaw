name: Publish verified release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_commit:
        description: 'Optional full merged commit SHA to resume publication (no rebuild)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify and publish existing candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.merge_commit || github.sha }}
        run: python .github/scripts/release.py publish
