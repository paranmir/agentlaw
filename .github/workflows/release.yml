name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($IsWindows) { 'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing workspace version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match Cargo version' }
      - name: Format and test
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) {
            sh -n install.sh
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cargo test --locked --workspace --no-fail-fast --target ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build release executables
        if: github.event_name != 'pull_request'
        run: |
          cargo build --locked --release --workspace --target ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          New-Item -ItemType Directory -Path dist, bundle | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          foreach ($name in @('agentlaw', 'agentlaw-worker')) {
            Copy-Item "target/${{ matrix.target }}/release/$name$suffix" bundle/
          }
          Copy-Item LICENSE bundle/
          & "./bundle/agentlaw$suffix" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $name = 'agentlaw-${{ matrix.target }}'
          if ($IsWindows) {
            Compress-Archive -Path bundle/* -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C bundle agentlaw agentlaw-worker LICENSE
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: agentlaw-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: agentlaw-*
          path: dist
          merge-multiple: true
      - name: Publish tested commit and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing workspace version' }
          $tag = "v$version"
          Copy-Item install.sh, install.ps1 dist/
          $checksums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS'), $checksums, [Text.UTF8Encoding]::new($false))
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Agentlaw $version" --notes-file docs/release-notes.md --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
