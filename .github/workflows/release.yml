name: Release candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release helper
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($IsWindows) { 'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing workspace version' }
      - name: Format and test
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) {
            sh -n install.sh
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cargo test --locked --workspace --no-fail-fast --target ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build release executables
        run: |
          cargo build --locked --release --workspace --target ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist, bundle | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          foreach ($name in @('agentlaw', 'agentlaw-worker', 'agentlaw-launcher')) {
            Copy-Item "target/${{ matrix.target }}/release/$name$suffix" bundle/
          }
          Copy-Item LICENSE bundle/
          & "./bundle/agentlaw$suffix" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $name = 'agentlaw-${{ matrix.target }}'
          if ($IsWindows) {
            Compress-Archive -Path bundle/* -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C bundle agentlaw agentlaw-worker agentlaw-launcher LICENSE
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          git diff --exit-code
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/scripts/release.py manifest --target '${{ matrix.target }}' --directory dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: agentlaw-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
