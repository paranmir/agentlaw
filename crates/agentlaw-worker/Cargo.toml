[package]
name = "agentlaw-worker"
version.workspace = true
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
fs2 = "0.4"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
agentlaw-search = { path = "../agentlaw-search" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
