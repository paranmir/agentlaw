[package]
name = "agentlaw-search"
version.workspace = true
edition = "2021"

[features]
write-audit = ["agentlaw-sqlite/write-audit"]

[dependencies]
agentlaw-sqlite = { path = "../agentlaw-sqlite" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
