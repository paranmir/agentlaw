[package]
name = "agentlaw-runtime"
version.workspace = true
edition = "2021"

[features]
write-audit = ["agentlaw-sqlite/write-audit", "agentlaw-storage/write-audit"]
test-support = ["agentlaw-flows/test-support"]

[dependencies]
agentlaw-sqlite = { path = "../agentlaw-sqlite" }
agentlaw-contracts = { path = "../agentlaw-contracts" }
agentlaw-flows = { path = "../agentlaw-flows" }
agentlaw-search = { path = "../agentlaw-search" }
agentlaw-storage = { path = "../agentlaw-storage" }
agentlaw-worker = { path = "../agentlaw-worker" }
fs2.workspace = true
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
tempfile.workspace = true
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agentlaw-flows = { path = "../agentlaw-flows", features = ["test-support"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
