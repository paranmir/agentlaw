[package]
name = "agentlaw-runtime"
version.workspace = true
edition = "2021"

[features]
test-support = []

[dependencies]
agentlaw-contracts = { path = "../agentlaw-contracts" }
agentlaw-flows = { path = "../agentlaw-flows" }
agentlaw-search = { path = "../agentlaw-search" }
agentlaw-storage = { path = "../agentlaw-storage" }
agentlaw-worker = { path = "../agentlaw-worker" }
fs2.workspace = true
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
tempfile.workspace = true
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
